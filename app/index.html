<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>媒體下載器</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#15202b;background:#f4f6f8}
    body{margin:0;min-height:100vh;display:grid;place-items:center}.card{width:min(88vw,560px);background:white;padding:28px;border-radius:22px;box-shadow:0 14px 45px #18344a18}
    h1{margin:0 0 8px;font-size:28px}.hint{color:#536471;line-height:1.5}input,button{box-sizing:border-box;width:100%;font-size:17px;border-radius:12px;padding:14px}
    input{border:1px solid #c7d0d9;margin:12px 0 0}button{border:0;background:#0a84ff;color:white;font-weight:700;cursor:pointer;margin-top:12px}button:disabled{opacity:.55}
    #key{font-size:15px}.setup{display:none;padding:12px;background:#fff4d6;color:#6d4c00;border-radius:12px;margin:14px 0;line-height:1.45}
    #status{min-height:24px;margin-top:14px;color:#536471;white-space:pre-wrap}.legal{font-size:13px;color:#7b8793;margin-top:18px}
  </style>
</head>
<body><main class="card"><h1>媒體下載器</h1><div class="hint">貼上 Facebook、Instagram、X、Bilibili、YouTube 或小紅書的公開網址。</div>
  <div id="setup" class="setup">此頁不能直接從電腦檔案開啟。請先部署服務，再開啟服務的 HTTPS 網址；或在本機啟動服務後前往 <b>http://localhost:8080</b>。</div>
  <input id="url" type="url" placeholder="https://…" autocomplete="off">
  <input id="key" type="password" placeholder="API 金鑰（若服務有設定）" autocomplete="off">
  <button id="go">開始下載</button><div id="status"></div>
  <div class="legal">只下載你擁有或獲准保存的內容。私人內容、DRM 與登入限定內容不支援。</div></main>
<script>
const button=document.querySelector('#go'),status=document.querySelector('#status'),input=document.querySelector('#url'),keyInput=document.querySelector('#key'),setup=document.querySelector('#setup');
const isLocalFile=location.protocol==='file:';if(isLocalFile){setup.style.display='block';button.disabled=true}keyInput.value=localStorage.getItem('downloadApiKey')||'';
button.onclick=async()=>{button.disabled=true;status.textContent='正在處理，請稍候…';try{const headers={'Content-Type':'application/json'};const key=keyInput.value.trim();if(key){headers['X-API-Key']=key;localStorage.setItem('downloadApiKey',key)}else{localStorage.removeItem('downloadApiKey')}
const response=await fetch('/api/download',{method:'POST',headers,body:JSON.stringify({url:input.value})});if(!response.ok){let data;try{data=await response.json()}catch{}throw new Error(data?.detail||`下載失敗 (${response.status})`)}
const blob=await response.blob(),a=document.createElement('a'),disposition=response.headers.get('content-disposition')||'';let name='download';const match=disposition.match(/filename\*?=(?:UTF-8''|\")?([^\";]+)/i);if(match)name=decodeURIComponent(match[1].replace(/\"/g,''));a.href=URL.createObjectURL(blob);a.download=name;a.click();URL.revokeObjectURL(a.href);status.textContent='下載已開始。';}catch(error){status.textContent=error.message}finally{if(!isLocalFile)button.disabled=false}};
</script></body></html>
