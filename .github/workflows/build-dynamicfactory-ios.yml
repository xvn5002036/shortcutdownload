name: Build DynamicFactory iOS

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'ios/DynamicFactory/**'
      - '.github/workflows/build-dynamicfactory-ios.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build iOS App
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode_16.4.app/Contents/Developer || true
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios/DynamicFactory
        run: xcodegen generate

      - name: Build for iPhoneOS (unsigned)
        working-directory: ios/DynamicFactory
        run: |
          set -o pipefail
          xcodebuild \
            -project DynamicFactory.xcodeproj \
            -scheme DynamicFactory \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY='' \
            build | tee build.log

      - name: Package compiled app
        working-directory: ios/DynamicFactory
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/動圖工廠.app"
          if [ ! -d "$APP_PATH" ]; then
            APP_PATH=$(find build/Build/Products/Release-iphoneos -maxdepth 1 -name '*.app' -type d | head -n 1)
          fi
          test -n "$APP_PATH"
          ditto -c -k --sequesterRsrc --keepParent "$APP_PATH" DynamicFactory-iOS-unsigned.zip

      - name: Upload compiled iOS app
        uses: actions/upload-artifact@v4
        with:
          name: DynamicFactory-iOS-unsigned
          path: ios/DynamicFactory/DynamicFactory-iOS-unsigned.zip
          if-no-files-found: error
          retention-days: 30

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: DynamicFactory-build-log
          path: ios/DynamicFactory/build.log
          if-no-files-found: ignore
          retention-days: 7
