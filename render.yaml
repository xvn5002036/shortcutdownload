services:
  - type: web
    name: xhs-pro-system
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DOWNLOAD_API_KEY
        sync: false
      - key: XHS_ADMIN_TOKEN
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: MAX_DOWNLOAD_MB
        value: 250
      - key: DOWNLOAD_TIMEOUT_SECONDS
        value: 180
